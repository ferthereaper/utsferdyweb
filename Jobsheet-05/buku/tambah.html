<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <!--Jobsheet 3-->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Pemesanan UMKM | Tambah Produk</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
        <h1>Pemesanan UMKM</h1>
        <!--Jobsheet 5-->
        <button type="button" id="nav-toggle-btn" class="nav-toggle-label" aria-label="Menu">&#9776;</button>
        <nav>
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="list.html">Daftar Produk</a></li>
                <li><a href="tambah.html">Tambah Produk</a></li>
                <li><a href="../anggota/list.html">Daftar Pelanggan</a></li>
                <li><a href="../anggota/tambah.html">Tambah Pelanggan</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Tambah Produk</h2>
            <form>
                <p>
                    <label for="nama_produk">Nama Produk</label><br>
                    <input type="text" name="nama_produk" id="nama_produk" required>
                </p>
                <p>
                    <label for="kategori">Kategori</label><br>
                    <select name="kategori" id="kategori">
                        <option value="makanan">Makanan</option>
                        <option value="minuman">Minuman</option>
                        <option value="kerajinan">Kerajinan</option>
                    </select>
                </p>
                <p>
                    <label for="harga">Harga (Rp)</label><br>
                    <input type="number" name="harga" id="harga" min="0" required>
                </p>
                <p>
                    <label for="stok">Stok</label><br>
                    <input type="number" name="stok" id="stok" min="0" required>
                </p>
                <p>
                    <label for="deskripsi">Deskripsi</label><br>
                    <textarea name="deskripsi" id="deskripsi" rows="3"></textarea>
                </p>
                <p>
                    <button type="submit">Simpan</button>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Sistem Pemesanan UMKM &mdash; Jobsheet 1</p>
    </footer>
    <!-- JS 5 -->
    <script src="../assets/js/app.js"></script>
</body>
</html>
